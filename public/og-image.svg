<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(255,255,255,0.03)"/>

  <!-- Logo/Icon placeholder - abstract tensor/grid icon -->
  <g transform="translate(540, 180)">
    <rect x="0" y="0" width="30" height="30" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="45" y="0" width="30" height="30" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="90" y="0" width="30" height="30" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="0" y="45" width="30" height="30" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="45" y="45" width="30" height="30" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="90" y="45" width="30" height="30" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="0" y="90" width="30" height="30" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="45" y="90" width="30" height="30" rx="4" fill="rgba(255,255,255,0.7)"/>
    <rect x="90" y="90" width="30" height="30" rx="4" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- Main title -->
  <text x="600" y="380" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">
    TensorEval
  </text>

  <!-- Tagline -->
  <text x="600" y="450" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.85)" text-anchor="middle">
    CI/CD for AI Agents
  </text>

  <!-- Subtext -->
  <text x="600" y="510" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Deterministic evaluation for production AI systems
  </text>
</svg>
